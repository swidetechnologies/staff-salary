# Free Supabase projects pause after about a week of low activity, and the app
# cannot work while paused. This runs a real sign-in and read every 3 days.
# Both values below are public by design: they are also inside the published app.
name: Keep database awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: https://yuwseocyywviealdtcjq.supabase.co
      KEY: sb_publishable_T9eyKSWfykBpeQbS5EeqLA_sw2qKMPt
    steps:
      - name: Sign in and read from the database
        run: |
          token=$(curl -sS --fail-with-body "$URL/auth/v1/signup" -X POST -H "apikey: $KEY" -H 'content-type: application/json' -d '{"data":{}}' | jq -r .access_token)
          curl -sS --fail-with-body "$URL/rest/v1/sal_months?select=month&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $token"
      # GitHub turns off scheduled jobs after 60 days with no repo activity.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Keep this job switched on
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit --allow-empty -m 'Keep scheduled job active'
            git push
          fi
